name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Deploy changed functions
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN secret and SUPABASE_PROJECT_REF variable on the production environment"
            exit 1
          fi

          deploy() {
            supabase functions deploy "$@" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          }

          # Manual runs, unknown history, and config/shared-code changes redeploy every function.
          # Never --prune: production has functions that are not in this repo.
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            deploy
            exit 0
          fi

          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/)
          if echo "$changed" | grep -qE '^supabase/(config\.toml|functions/_shared/)'; then
            deploy
            exit 0
          fi

          names=$(echo "$changed" | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' | sort -u)
          for name in $names; do
            if [ -d "supabase/functions/$name" ]; then
              deploy "$name"
            else
              echo "Skipping $name: removed from repo (delete it in the dashboard if no longer needed)"
            fi
          done
